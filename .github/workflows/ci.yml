name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Una ejecución nueva cancela la anterior de la misma rama o PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `npm ci` ejecuta `prepare` (husky): en CI no hacen falta los hooks de git.
  HUSKY: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  calidad:
    name: Calidad, compilación y auditoría
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tipos, lint, formato y pruebas
        run: npm run check

      - name: Pruebas del hook de IA
        run: npm run test:hook

      - name: Compilar
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: localhost
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-gestor-proyectos
          NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
          FIREBASE_PROJECT_ID: demo-gestor-proyectos

      - name: Auditar dependencias
        run: npm audit --audit-level=high
